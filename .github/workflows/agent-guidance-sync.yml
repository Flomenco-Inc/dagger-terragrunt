name: agent guidance sync

# Canonical inline v1 for public repositories that cannot call private workflows.
on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-guidance:
    name: check / agent-guidance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Generate and verify guidance
        id: verify
        run: |
          set -euo pipefail
          chmod +x scripts/{gen-agent-guidance,check-agent-guidance,gen-claude-bridges,check-claude-bridges}.sh
          scripts/gen-agent-guidance.sh
          scripts/check-agent-guidance.sh
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "stale=true" >>"$GITHUB_OUTPUT"
            git add -N --all
            git diff --binary >"$RUNNER_TEMP/agent-guidance.patch"
            echo "::error::Cursor–Claude guidance is stale. Apply the uploaded patch or regenerate locally."
            exit 1
          fi
      - name: Upload generated patch
        if: failure() && steps.verify.outputs.stale == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-guidance-patch
          path: ${{ runner.temp }}/agent-guidance.patch
          if-no-files-found: error
