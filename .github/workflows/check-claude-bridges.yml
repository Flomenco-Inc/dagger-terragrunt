name: check claude bridges

# Ensures CLAUDE.md bridges stay in sync with AGENTS.md and .cursor/rules
# (Claude Code reads CLAUDE.md; Cursor reads AGENTS.md + .mdc rules).

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

jobs:
  claude-bridges:
    name: check / claude-bridges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Verify Claude Code bridges
        run: |
          set -eu
          chmod +x scripts/check-claude-bridges.sh
          ./scripts/check-claude-bridges.sh
